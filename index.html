<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กฎระเบียบ | Royal Thai Military - Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ปรับโทนสีใหม่ทั้งหมดให้สว่างและอ่านง่ายขึ้น */
  :root {
    --gold: #d4af37;
    --gold-light: #fce280;
    --dark: #121822;         /* สว่างกว่าเดิม (น้ำเงินเข้มแทนดำสนิท) */
    --dark2: #1b2330;
    --dark3: #222b3a;
    --panel: #1e2736;        /* สีพื้นหลังการ์ดให้สว่างขึ้น */
    --border: rgba(212, 175, 55, 0.4);
    --text: #ffffff;         /* ขาวบริสุทธิ์ */
    --text-dim: #c5ceda;     /* เทาสว่าง อ่านง่าย ไม่จม */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px);
    pointer-events: none;
  }

  /* ─── LANDING PAGE ─── */
  #landing {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  .emblem {
    width: 120px; height: 120px;
    border: 3px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 2rem;
    position: relative;
    background: rgba(212,175,55,0.15);
  }
  .emblem-icon { font-size: 4rem; }

  .rank-badge {
    font-family: 'Chakra Petch', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .title-main {
    font-family: 'Chakra Petch', monospace;
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }
  .title-sub {
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 400;
    color: var(--text-dim);
    margin-bottom: 0.6rem;
  }
  .title-en {
    font-family: 'Chakra Petch', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 3rem;
  }

  .info-row {
    display: flex; gap: 1.5rem; justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }
  .info-chip {
    background: var(--dark3);
    border: 1px solid var(--border);
    padding: 0.6rem 1.5rem;
    border-radius: 6px;
    font-size: 0.9rem;
    color: var(--gold-light);
    font-family: 'Chakra Petch', monospace;
    font-weight: 600;
  }
  .info-chip span { color: var(--text-dim); font-size: 0.8rem; margin-right: 0.5rem; font-weight: 400; }

  .btn-start {
    position: relative;
    padding: 1rem 3.5rem;
    background: var(--gold);
    border: 2px solid var(--gold-light);
    border-radius: 6px;
    font-family: 'Chakra Petch', monospace;
    font-size: 1.2rem; font-weight: 700;
    letter-spacing: 0.1em;
    color: #000000;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 10;
  }
  .btn-start:hover {
    background: var(--gold-light);
    transform: scale(1.05);
  }

  .warning-box {
    margin-top: 3rem;
    border: 1px solid #ff6b6b;
    background: rgba(255, 107, 107, 0.15);
    padding: 1rem 1.5rem;
    border-radius: 6px;
    font-size: 0.95rem;
    color: #ffcccc;
    max-width: 500px;
    line-height: 1.5;
  }
  .warning-box strong { color: #ff6b6b; font-size: 1rem; }

  /* ─── RULES PAGE ─── */
  #rules-page {
    display: none;
    position: relative; z-index: 1;
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--dark2);
    border-bottom: 2px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex; align-items: center; gap: 1rem;
    flex-wrap: wrap;
  }
  .topbar-logo {
    font-family: 'Chakra Petch', monospace;
    font-weight: 700; font-size: 1.1rem;
    color: var(--gold-light);
    white-space: nowrap;
  }

  .search-wrap {
    flex: 1; min-width: 250px;
    position: relative;
  }
  .search-icon {
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 1.1rem; pointer-events: none;
  }
  #search-input {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.7rem 1rem 0.7rem 2.8rem;
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem;
    outline: none;
  }
  #search-input::placeholder { color: #99aabf; }
  #search-input:focus { border-color: var(--gold-light); background: var(--panel); }

  .filter-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .filter-btn {
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    background: var(--dark3);
    border-radius: 4px;
    color: var(--text-dim);
    font-family: 'Sarabun', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: var(--gold-light);
    color: #000;
    background: var(--gold);
  }

  .btn-back {
    padding: 0.5rem 1.2rem;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid #ff6b6b;
    border-radius: 4px;
    color: #ffcccc;
    font-family: 'Chakra Petch', monospace;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-back:hover { background: #ff6b6b; color: #000; }

  /* CONTENT AREA */
  .content-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .category-header {
    background: var(--dark3);
    padding: 0.8rem 1.5rem;
    border-left: 4px solid var(--gold-light);
    border-radius: 4px;
    margin: 3rem 0 1.5rem;
    font-family: 'Chakra Petch', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold-light);
  }
  .category-header:first-child { margin-top: 0; }

  /* RULE CARD */
  .rule-card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.1);
    border-left: 5px solid var(--gold);
    border-radius: 8px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 1rem;
    display: flex; gap: 1.2rem;
  }

  /* สีระดับความรุนแรง (สว่างขึ้น) */
  .rule-card.sev-ban   { border-left-color: #ff4d4d; }
  .rule-card.sev-warn  { border-left-color: #ffa502; }
  .rule-card.sev-duty  { border-left-color: #1e90ff; }
  .rule-card.sev-honor { border-left-color: var(--gold-light); }

  .rule-num {
    font-family: 'Chakra Petch', monospace;
    font-size: 1.6rem; font-weight: 700;
    color: var(--gold-light);
    min-width: 50px;
  }
  .rule-body { flex: 1; }
  .rule-title {
    font-size: 1.15rem; font-weight: 700;
    color: #ffffff;
    margin-bottom: 0.4rem;
  }
  .rule-desc {
    font-size: 1rem; font-weight: 400;
    color: #dbe4f0; /* สว่าง อ่านง่ายสุดๆ */
    line-height: 1.6;
  }
  .rule-tags { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .tag {
    font-family: 'Chakra Petch', monospace;
    font-size: 0.75rem;
    padding: 0.3rem 0.7rem;
    border-radius: 4px;
    font-weight: 700;
  }
  .tag-ban   { background: rgba(255,77,77,0.2); color: #ff6b6b; border: 1px solid #ff4d4d; }
  .tag-warn  { background: rgba(255,165,2,0.2); color: #ffa502; border: 1px solid #ffa502; }
  .tag-duty  { background: rgba(30,144,255,0.2); color: #70a1ff; border: 1px solid #1e90ff; }
  .tag-honor { background: rgba(212,175,55,0.2); color: var(--gold-light); border: 1px solid var(--gold); }
  .tag-gameplay { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid #2ecc71; }

  /* SCROLL TO TOP */
  #scroll-top {
    position: fixed; bottom: 2rem; right: 2rem;
    width: 50px; height: 50px;
    background: var(--gold);
    border: none;
    border-radius: 50%;
    color: #000;
    font-size: 1.5rem; font-weight: bold;
    cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  #scroll-top.show { display: flex; }

  @media(max-width:768px) {
    .filter-btns { display: none; }
    .topbar { flex-direction: column; align-items: stretch; }
    .btn-back { align-self: flex-start; }
    .rule-card { flex-direction: column; gap: 0.5rem; }
    .rule-num { font-size: 1.2rem; margin-bottom: -0.5rem; }
  }
</style>
</head>
<body>

<section id="landing">
  <div class="emblem"><div class="emblem-icon">⚔️</div></div>
  <div class="rank-badge">Royal Thai Military · Roblox Official</div>
  <h1 class="title-main">กฎระเบียบทหารไทย</h1>
  <p class="title-sub">ระเบียบข้อบังคับและจรรยาบรรณ ฉบับที่ 2.5</p>
  <div class="info-row">
    <div class="info-chip"><span>ฉบับ</span>2025</div>
    <div class="info-chip"><span>มาตรา</span>50 ข้อ</div>
    <div class="info-chip"><span>สถานะ</span>บังคับใช้</div>
  </div>
  <button class="btn-start" id="btn-enter">⚡ เริ่มดูกฎระเบียบ</button>
  <div class="warning-box">
    <strong>⚠ คำเตือน:</strong> ผู้ฝ่าฝืนกฎระเบียบจะได้รับโทษตามมาตราที่กำหนด รวมถึงการไล่ออกจากหน่วย
  </div>
</section>

<section id="rules-page">
  <div class="topbar">
    <div class="topbar-logo">⚔️ RTM-RBX</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="ค้นหามาตรา หรือ คำสำคัญ...">
    </div>
    <div class="filter-btns" id="filter-container">
      <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
      <button class="filter-btn" data-filter="ban">🔴 ข้อห้าม</button>
      <button class="filter-btn" data-filter="warn">🟠 คำเตือน</button>
      <button class="filter-btn" data-filter="duty">🔵 หน้าที่</button>
      <button class="filter-btn" data-filter="honor">🟡 เกียรติยศ</button>
    </div>
    <button class="btn-back" id="btn-back">← กลับหน้าแรก</button>
  </div>
  <div class="content-wrap" id="rules-list"></div>
</section>

<button id="scroll-top">↑</button>

<script>
// รอให้ HTML โหลดเสร็จ 100% ค่อยเริ่มรัน Script เพื่อป้องกันบัคปุ่มกดไม่ได้
document.addEventListener('DOMContentLoaded', () => {
  
  const categories = [
    {

        { no:3, sev:"ban", title:"ห้ามใช้ภาษาหยาบคาย", desc:"ห้ามใช้คำหยาบ คำสบถ หรือภาษาที่ไม่สุภาพในทุกช่องทางการสื่อสาร", tags:["ban"] },
        { no:4, sev:"ban", title:"ห้ามแกล้งทำเป็นผู้บังคับบัญชา", desc:"ห้ามปลอมตัวหรืออ้างว่าตนเองมียศสูงกว่าความเป็นจริง การกระทำนี้ถือเป็นการฉ้อโกงและมีโทษไล่ออกทันที", tags:["ban"] },
        { no:5, sev:"duty", title:"การลงทะเบียนชื่อ", desc:"สมาชิกต้องตั้งชื่อ Roblox ให้ตรงกับรูปแบบที่หน่วยกำหนด เช่น [RTM] ชื่อ_ยศ", tags:["duty"] },
        { no:6, sev:"warn", title:"การขาด Formation โดยไม่มีเหตุผล", desc:"สมาชิกที่ขาด Formation เกิน 3 ครั้งโดยไม่แจ้งล่วงหน้าจะได้รับการตักเตือนอย่างเป็นทางการ", tags:["warn"] },

        { no:8, sev:"honor", title:"ความภักดีต่อหน่วย", desc:"สมาชิกต้องให้ความจงรักภักดีต่อหน่วยและไม่กระทำการใดที่เสื่อมเสียชื่อเสียง", tags:["honor"] }

    },
    {
      id: "combat", label: "หมวดที่ 2 — กฎการรบและการปฏิบัติภารกิจ",

        { no:10, sev:"ban", title:"ห้ามยิงก่อนสัญญาณ", desc:"สมาชิกต้องรอสัญญาณจากผู้นำก่อนเปิดฉากยิง ห้ามยิงโดยพลการ", tags:["ban","gameplay"] },
        { no:11, sev:"duty", title:"การรายงานตำแหน่งศัตรู", desc:"ต้องรายงานตำแหน่งศัตรูที่พบเห็นทันทีในรูปแบบ: ทิศทาง-ระยะ-จำนวน", tags:["duty","gameplay"] },
        { no:12, sev:"duty", title:"การใช้ยานพาหนะ", desc:"ต้องได้รับอนุญาตก่อนนำยานพาหนะออกใช้งาน", tags:["duty","gameplay"] },

        { no:15, sev:"duty", title:"การปฐมพยาบาลเพื่อนร่วมรบ", desc:"ต้องช่วยเหลือสมาชิกที่บาดเจ็บก่อนการสู้รบต่อ เว้นแต่สถานการณ์อันตราย", tags:["duty","gameplay"] },

        { no:21, sev:"duty", title:"การรายงานตัวต่อผู้บัญชาการ", desc:"เมื่อเข้าสู่ฐานทัพ สมาชิกต้องรายงานตัวผ่านระบบทุกครั้ง", tags:["duty"] },

      ]

    {

    {
      id: "conduct", label: "หมวดที่ 5 — จรรยาบรรณและพฤติกรรม",
      rules: [

        { no:32, sev:"ban", title:"ห้ามเผยแพร่ข้อมูลส่วนตัว", desc:"ห้ามเปิดเผยข้อมูลส่วนตัวของสมาชิก (Doxxing)", tags:["ban"] },

        { no:35, sev:"warn", title:"การพูดคุยเรื่องการเมืองหรือศาสนา", desc:"ห้ามพูดคุยเรื่องละเอียดอ่อนเพื่อป้องกันความขัดแย้ง", tags:["warn"] },
        { no:36, sev:"honor", title:"การใช้ภาษาไทยในการสื่อสาร", desc:"การสื่อสารหลักให้ใช้ภาษาไทย", tags:["honor"] },

    {

      rules: [

        { no:46, sev:"duty", title:"การปฏิบัติต่อเชลยศึก", desc:"ต้องปฏิบัติตามกฎสากล In-game Geneva Convention", tags:["duty","honor"] },
        { no:47, sev:"ban", title:"ห้ามใช้งบประมาณหน่วยพลการ", desc:"Robux ของกลุ่มต้องได้รับการอนุมัติก่อนใช้จ่าย", tags:["ban"] },
        { no:48, sev:"warn", title:"การยุติภารกิจก่อนกำหนด", desc:"การออกจากเซิร์ฟเวอร์ระหว่างภารกิจต้องแจ้งเหตุผลเสมอ", tags:["warn","gameplay"] },
        { no:49, sev:"honor", title:"กฎการเกษียณอายุราชการ", desc:"ขอสถานะ Veteran ได้หลังมีชั่วโมงงาน > 200 ชม.", tags:["honor"] },
        { no:50, sev:"honor", title:"คำปฏิญาณของทหาร", desc:"รับใช้หน่วยด้วยความซื่อสัตย์ กล้าหาญ และเสียสละ", tags:["honor"] }
      ]
    }
  ];

  // Element References
  const landingPage = document.getElementById('landing');
  const rulesPage = document.getElementById('rules-page');
  const rulesList = document.getElementById('rules-list');
  const searchInput = document.getElementById('search-input');
  const btnEnter = document.getElementById('btn-enter');
  const btnBack = document.getElementById('btn-back');
  const btnScrollTop = document.getElementById('scroll-top');
  const filterBtns = document.querySelectorAll('.filter-btn');

  let currentSearch = '';
  let currentFilter = 'all';

  function tagLabel(t) {
    const map = { ban:'ข้อห้าม', warn:'คำเตือน', duty:'หน้าที่', honor:'เกียรติยศ', gameplay:'Gameplay' };
    return map[t] || t;
  }

  function render() {
    let html = '';
    
    categories.forEach(cat => {
      // Filter logic
      const filteredRules = cat.rules.filter(r => {
        const matchFilter = (currentFilter === 'all') || (r.sev === currentFilter) || (r.tags.includes(currentFilter));
        const q = currentSearch.toLowerCase();
        const matchSearch = !q || 
          r.title.toLowerCase().includes(q) || 
          r.desc.toLowerCase().includes(q) || 
          String(r.no).includes(q);
        
        return matchFilter && matchSearch;
      });

      if (filteredRules.length === 0) return;

      // Render Category Header
      html += `<div class="category-header">${cat.label}</div>`;

      // Render Rules
      filteredRules.forEach(r => {
        const tagsHtml = r.tags.map(t => `<span class="tag tag-${t}">${tagLabel(t)}</span>`).join('');
        html += `
          <div class="rule-card sev-${r.sev}">
            <div class="rule-num">${String(r.no).padStart(2,'0')}</div>
            <div class="rule-body">
              <div class="rule-title">มาตรา ${r.no} — ${r.title}</div>
              <div class="rule-desc">${r.desc}</div>
              <div class="rule-tags">${tagsHtml}</div>
            </div>
          </div>
        `;
      });
    });

    if (html === '') {
      html = `<div style="text-align:center; padding: 3rem; color: #a0b0c0;">
        <h3 style="font-family:'Chakra Petch', sans-serif;">ไม่พบข้อมูลมาตราที่ค้นหา</h3>
      </div>`;
    }

    rulesList.innerHTML = html;
  }

  // Event Listeners
  btnEnter.addEventListener('click', () => {
    landingPage.style.display = 'none';
    rulesPage.style.display = 'block';
    render();
    window.scrollTo(0,0);
  });

  btnBack.addEventListener('click', () => {
    rulesPage.style.display = 'none';
    landingPage.style.display = 'flex';
    window.scrollTo(0,0);
  });

  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      filterBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.getAttribute('data-filter');
      render();
    });
  });

  // Scroll to Top
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      btnScrollTop.classList.add('show');
    } else {
      btnScrollTop.classList.remove('show');
    }
  });

  btnScrollTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

});
</script>
